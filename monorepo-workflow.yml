name: Monorepo CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed packages
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'packages/api/**'
            web:
              - 'packages/web/**'
            shared:
              - 'packages/shared/**'
            mobile:
              - 'packages/mobile/**'
  
  test-api:
    name: Test API Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.packages, 'api') || contains(needs.detect-changes.outputs.packages, 'shared')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build shared package
        if: contains(needs.detect-changes.outputs.packages, 'shared')
        run: npm run build --workspace=@monorepo/shared
      
      - name: Test API
        run: npm test --workspace=@monorepo/api
  
  test-web:
    name: Test Web Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.packages, 'web') || contains(needs.detect-changes.outputs.packages, 'shared')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build shared package
        if: contains(needs.detect-changes.outputs.packages, 'shared')
        run: npm run build --workspace=@monorepo/shared
      
      - name: Test Web
        run: npm test --workspace=@monorepo/web
      
      - name: Build Web
        run: npm run build --workspace=@monorepo/web
  
  test-mobile:
    name: Test Mobile Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.packages, 'mobile') || contains(needs.detect-changes.outputs.packages, 'shared')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build shared package
        if: contains(needs.detect-changes.outputs.packages, 'shared')
        run: npm run build --workspace=@monorepo/shared
      
      - name: Test Mobile
        run: npm test --workspace=@monorepo/mobile
  
  deploy:
    name: Deploy Changed Packages
    runs-on: ubuntu-latest
    needs: [detect-changes, test-api, test-web, test-mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy API
        if: contains(needs.detect-changes.outputs.packages, 'api')
        run: |
          echo "Deploying API package"
          # TODO: Add deployment commands
      
      - name: Deploy Web
        if: contains(needs.detect-changes.outputs.packages, 'web')
        run: |
          echo "Deploying Web package"
          # TODO: Add deployment commands
      
      - name: Deploy Mobile
        if: contains(needs.detect-changes.outputs.packages, 'mobile')
        run: |
          echo "Deploying Mobile package"
          # TODO: Add deployment commands
