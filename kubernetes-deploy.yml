name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CLUSTER_NAME: production-cluster  # TODO: Update
  CLUSTER_ZONE: us-central1-a      # TODO: Update
  NAMESPACE: default               # TODO: Update
  DEPLOYMENT_NAME: my-app          # TODO: Update

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone=${{ env.CLUSTER_ZONE }}
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.DEPLOYMENT_NAME }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m
      
      # Alternative: Deploy with kubectl
      # - name: Deploy with kubectl
      #   run: |
      #     kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
      #       app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
      #       -n ${{ env.NAMESPACE }}
      #     kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
      #       -n ${{ env.NAMESPACE }}
      
      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
      
      - name: Run health check
        run: |
          # TODO: Add your health check endpoint
          # curl -f https://your-app.com/health || exit 1
          echo "Health check passed"
      
      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback ${{ env.DEPLOYMENT_NAME }} \
            --namespace ${{ env.NAMESPACE }}
